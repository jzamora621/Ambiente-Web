<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto</title>


  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-primary text-white text-center">
        <h3>Formulario de Contacto</h3>
      </div>

      <div class="card-body">
        <form id="contactForm" novalidate>

        
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre completo">
          </div>

        
          <div class="mb-3">
            <label for="correo" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
          </div>

   
          <div class="mb-3">
            <label for="asunto" class="form-label">Asunto</label>
            <select class="form-select" id="asunto">
              <option value="">Seleccione una opción</option>
              <option value="Consulta General">Consulta General</option>
              <option value="Soporte Técnico">Soporte Técnico</option>
              <option value="Sugerencia">Sugerencia</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="4" placeholder="Escriba su mensaje"></textarea>
          </div>

     
          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" id="btnLimpiar">Limpiar</button>
            <button type="submit" class="btn btn-primary">Enviar</button>
          </div>
        </form>

        <div id="vistaPrevia" class="alert alert-success mt-4 d-none">
          <h5 class="alert-heading">Vista Previa del Mensaje</h5>
          <p><strong>Nombre:</strong> <span id="prevNombre"></span></p>
          <p><strong>Correo:</strong> <span id="prevCorreo"></span></p>
          <p><strong>Asunto:</strong> <span id="prevAsunto"></span></p>
          <p><strong>Mensaje:</strong> <span id="prevMensaje"></span></p>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

 
  <script src="assets/js/formularioContacto.js"></script>
</body>
</html>
